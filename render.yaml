services:
  - type: web
    name: metroclock-cloud-api
    runtime: python
    plan: free
    rootDir: cloud_api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: METROCLOCK_CORS_ORIGINS
        sync: false
      - key: METROCLOCK_DEBUG_DASHBOARD_ENABLED
        value: "false"
      # Provider keys for the /api/devices/{uid}/data proxy. Set in the Render
      # dashboard; they must never be shipped inside a device image.
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: AVIATIONSTACK_API_KEY
        sync: false
      # Flight data. AERODATABOX_API_KEY takes precedence over AviationStack.
      # PLATFORM picks the storefront (apimarket, rapidapi, direct); BASE_URL
      # and AUTH_HEADER override the defaults when the dashboard says otherwise.
      - key: AERODATABOX_API_KEY
        sync: false
      - key: AERODATABOX_PLATFORM
        value: apimarket
      - key: AERODATABOX_BASE_URL
        sync: false
      - key: AERODATABOX_AUTH_HEADER
        sync: false
