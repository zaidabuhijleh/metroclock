<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1280" viewBox="0 0 1800 1280">
  <defs>
    <style>
      .page { fill: #f7f7f5; }
      .card { fill: #fff; stroke: #dedede; stroke-width: 2; }
      .ink { fill: #202326; }
      .slate { fill: #5c6367; }
      .light { fill: #f4f5f2; }
      .white { fill: #fff; }
      .red { fill: #dd2f45; }
      .orange { fill: #ff981d; }
      .blue { fill: #0788c8; }
      .green { fill: #009d5b; }
      .yellow { fill: #f8cc18; }
      .gray { fill: #8f9693; }
      .charcoal { fill: #202427; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 48px; font-weight: 800; }
      .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 400; fill: #62676a; }
      .card-title { font-family: Arial, Helvetica, sans-serif; font-size: 25px; font-weight: 800; }
      .note { font-family: Arial, Helvetica, sans-serif; font-size: 18px; font-weight: 400; fill: #686d70; }
      .metro-letter { font-family: Arial, Helvetica, sans-serif; font-size: 105px; font-weight: 900; }
      .clock-word { font-family: Arial, Helvetica, sans-serif; font-size: 118px; font-weight: 900; letter-spacing: 0; }
      .pill-metro { font-family: Arial, Helvetica, sans-serif; font-size: 88px; font-weight: 900; }
      .pill-clock { font-family: Arial, Helvetica, sans-serif; font-size: 70px; font-weight: 900; }
      .tiny { font-family: Menlo, Consolas, monospace; font-size: 10px; font-weight: 800; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 15px; font-weight: 400; fill: #777; }
    </style>
  </defs>

  <rect class="page" width="1800" height="1280"/>
  <text x="70" y="82" class="title ink">MetroClock Refined Favorites</text>
  <text x="72" y="124" class="subtitle">Built from the two favorites: softer clock text, cleaner pill spacing, and LED-safe boot versions.</text>

  <!-- Favorite A: softer stacked wordmark -->
  <g transform="translate(70 180)">
    <rect class="card" width="800" height="420" rx="22"/>
    <text x="32" y="46" class="card-title ink">A. Soft Stacked Wordmark</text>
    <line x1="32" y1="72" x2="768" y2="72" stroke="#e6e6e3"/>

    <g transform="translate(86 110)">
      <circle cx="72" cy="72" r="72" class="red"/>
      <circle cx="200" cy="72" r="72" class="blue"/>
      <circle cx="328" cy="72" r="72" class="green"/>
      <circle cx="456" cy="72" r="72" class="orange"/>
      <circle cx="584" cy="72" r="72" class="yellow"/>
      <text x="20" y="108" class="metro-letter white">m</text>
      <text x="166" y="108" class="metro-letter white">e</text>
      <text x="300" y="108" class="metro-letter white">t</text>
      <text x="430" y="108" class="metro-letter white">r</text>
      <text x="548" y="108" class="metro-letter white">o</text>
      <text x="142" y="262" class="clock-word slate">clock</text>
    </g>

    <text x="32" y="372" class="note">Same core idea, but the clock text is transit gray instead of hard black.</text>
  </g>

  <!-- Favorite B: clock face O -->
  <g transform="translate(930 180)">
    <rect class="card" width="800" height="420" rx="22"/>
    <text x="32" y="46" class="card-title ink">B. Clock Face Variant</text>
    <line x1="32" y1="72" x2="768" y2="72" stroke="#e6e6e3"/>

    <g transform="translate(86 110)">
      <circle cx="72" cy="72" r="72" class="red"/>
      <circle cx="200" cy="72" r="72" class="blue"/>
      <circle cx="328" cy="72" r="72" class="green"/>
      <circle cx="456" cy="72" r="72" class="orange"/>
      <circle cx="584" cy="72" r="72" class="yellow"/>
      <text x="20" y="108" class="metro-letter white">m</text>
      <text x="166" y="108" class="metro-letter white">e</text>
      <text x="300" y="108" class="metro-letter white">t</text>
      <text x="430" y="108" class="metro-letter white">r</text>
      <text x="548" y="108" class="metro-letter white">o</text>

      <text x="96" y="262" class="clock-word slate">cl</text>
      <circle cx="320" cy="222" r="49" class="blue"/>
      <circle cx="320" cy="222" r="28" fill="none" stroke="#fff" stroke-width="8"/>
      <line x1="320" y1="222" x2="320" y2="199" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
      <line x1="320" y1="222" x2="342" y2="236" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
      <text x="372" y="262" class="clock-word slate">ck</text>
    </g>

    <text x="32" y="372" class="note">The colored clock face makes the lower word less plain without adding clutter.</text>
  </g>

  <!-- Favorite C: fixed pill layout -->
  <g transform="translate(70 670)">
    <rect class="card" width="800" height="420" rx="22"/>
    <text x="32" y="46" class="card-title ink">C. Pill, Fixed Spacing</text>
    <line x1="32" y1="72" x2="768" y2="72" stroke="#e6e6e3"/>

    <g transform="translate(66 115)">
      <rect x="0" y="0" width="668" height="188" rx="94" class="charcoal"/>
      <circle cx="70" cy="94" r="28" class="red"/>
      <circle cx="122" cy="94" r="28" class="orange"/>
      <circle cx="174" cy="94" r="28" class="blue"/>
      <circle cx="226" cy="94" r="28" class="green"/>
      <circle cx="278" cy="94" r="28" class="yellow"/>
      <text x="346" y="82" class="pill-metro white">metro</text>
      <text x="348" y="145" class="pill-clock" fill="#d9dddb">clock</text>
    </g>

    <text x="32" y="372" class="note">Same pill concept, but the text is smaller, aligned, and no longer colliding.</text>
  </g>

  <!-- Favorite D: pill with full wordmark -->
  <g transform="translate(930 670)">
    <rect class="card" width="800" height="420" rx="22"/>
    <text x="32" y="46" class="card-title ink">D. Pill, Single Word</text>
    <line x1="32" y1="72" x2="768" y2="72" stroke="#e6e6e3"/>

    <g transform="translate(58 118)">
      <rect x="0" y="0" width="684" height="178" rx="89" class="charcoal"/>
      <circle cx="70" cy="89" r="26" class="red"/>
      <circle cx="116" cy="89" r="26" class="orange"/>
      <circle cx="162" cy="89" r="26" class="blue"/>
      <circle cx="208" cy="89" r="26" class="green"/>
      <circle cx="254" cy="89" r="26" class="yellow"/>
      <text x="316" y="115" class="pill-metro white" font-size="80">metroclock</text>
    </g>

    <text x="32" y="372" class="note">Most compact pill. Better for headers/app icon usage than the boot screen.</text>
  </g>

  <!-- LED previews -->
  <g transform="translate(70 1120)">
    <rect width="1660" height="110" rx="18" fill="#1f2023"/>
    <text x="28" y="36" class="card-title white">Boot-screen read</text>

    <g transform="translate(260 22) scale(5)">
      <rect width="64" height="32" fill="#000"/>
      <circle cx="8" cy="9" r="6" class="red"/>
      <circle cx="20" cy="9" r="6" class="blue"/>
      <circle cx="32" cy="9" r="6" class="green"/>
      <circle cx="44" cy="9" r="6" class="orange"/>
      <circle cx="56" cy="9" r="6" class="yellow"/>
      <text x="4" y="12" class="tiny white">M</text>
      <text x="16" y="12" class="tiny white">E</text>
      <text x="28" y="12" class="tiny white">T</text>
      <text x="40" y="12" class="tiny white">R</text>
      <text x="52" y="12" class="tiny white">O</text>
      <text x="15" y="27" class="tiny white">CLOCK</text>
    </g>
    <text x="260" y="96" class="label">A/B matrix version</text>

    <g transform="translate(700 22) scale(5)">
      <rect width="64" height="32" fill="#000"/>
      <rect x="1" y="5" width="62" height="22" rx="10" class="charcoal" stroke="#555" stroke-width=".5"/>
      <circle cx="9" cy="16" r="4" class="red"/>
      <circle cx="18" cy="16" r="4" class="orange"/>
      <circle cx="27" cy="16" r="4" class="blue"/>
      <circle cx="36" cy="16" r="4" class="green"/>
      <circle cx="45" cy="16" r="4" class="yellow"/>
      <text x="50" y="14" class="tiny white">MC</text>
      <text x="50" y="24" class="tiny" fill="#d9dddb">OK</text>
    </g>
    <text x="700" y="96" class="label">C/D matrix version</text>

    <text x="1130" y="53" class="subtitle" fill="#d9dddb">Recommendation: A or B for brand; C for boot if you prefer the dark transit-sign feel.</text>
  </g>
</svg>
