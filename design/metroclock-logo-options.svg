<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320">
  <defs>
    <style>
      .bg { fill: #f8f8f6; }
      .card { fill: #fff; stroke: #dedede; stroke-width: 2; }
      .ink { fill: #18191b; }
      .muted { fill: #626466; }
      .soft { fill: #d8d8d8; }
      .white { fill: #fff; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 48px; font-weight: 700; }
      .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 400; }
      .card-title { font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 700; }
      .note { font-family: Arial, Helvetica, sans-serif; font-size: 18px; font-weight: 400; }
      .word { font-family: Arial, Helvetica, sans-serif; font-size: 88px; font-weight: 800; }
      .word-small { font-family: Arial, Helvetica, sans-serif; font-size: 56px; font-weight: 800; }
      .pill-word { font-family: Arial, Helvetica, sans-serif; font-size: 64px; font-weight: 800; }
      .preview-text { font-family: Menlo, Consolas, monospace; font-size: 10px; font-weight: 700; }
      .matrix-label { font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 400; fill: #777; }
      .red { fill: #dc2b3e; }
      .orange { fill: #f48d20; }
      .blue { fill: #0085ca; }
      .green { fill: #009954; }
      .yellow { fill: #f6c71a; }
      .gray { fill: #8e9491; }
      .teal { fill: #009b96; }
      .purple { fill: #7057bf; }
    </style>
  </defs>

  <rect class="bg" width="1800" height="1320"/>
  <text x="70" y="88" class="title ink">MetroClock Logo Directions</text>
  <text x="72" y="128" class="subtitle muted">Six directions based on transit color language, with a tiny boot-screen read under each.</text>

  <!-- Option 1 -->
  <g transform="translate(70 180)">
    <rect class="card" rx="18" width="540" height="330"/>
    <text x="24" y="42" class="card-title ink">1. Letter Stops</text>
    <line x1="24" y1="66" x2="516" y2="66" stroke="#e8e8e8"/>
    <circle cx="76" cy="162" r="54" class="red"/>
    <circle cx="146" cy="162" r="54" class="orange"/>
    <circle cx="216" cy="162" r="54" class="blue"/>
    <circle cx="286" cy="162" r="54" class="green"/>
    <circle cx="356" cy="162" r="54" class="yellow"/>
    <text x="44" y="187" class="word white">m</text>
    <text x="119" y="187" class="word white">e</text>
    <text x="197" y="187" class="word white">t</text>
    <text x="266" y="187" class="word white">r</text>
    <text x="331" y="187" class="word white">o</text>
    <text x="388" y="187" class="word ink">clock</text>
    <text x="24" y="258" class="note muted">Your idea directly: METRO gets colored station circles, CLOCK stays plain.</text>

    <g transform="translate(110 278)">
      <rect width="320" height="160" fill="#000" transform="scale(1 .32)"/>
      <circle cx="40" cy="16" r="22" class="red"/>
      <circle cx="100" cy="16" r="22" class="orange"/>
      <circle cx="160" cy="16" r="22" class="blue"/>
      <circle cx="220" cy="16" r="22" class="green"/>
      <circle cx="280" cy="16" r="22" class="yellow"/>
      <text x="28" y="20" class="preview-text white">M</text>
      <text x="88" y="20" class="preview-text white">E</text>
      <text x="148" y="20" class="preview-text white">T</text>
      <text x="208" y="20" class="preview-text white">R</text>
      <text x="268" y="20" class="preview-text white">O</text>
      <text x="95" y="30" class="preview-text white">CLOCK</text>
    </g>
  </g>

  <!-- Option 2 -->
  <g transform="translate(650 180)">
    <rect class="card" rx="18" width="540" height="330"/>
    <text x="24" y="42" class="card-title ink">2. Metro + Clock</text>
    <line x1="24" y1="66" x2="516" y2="66" stroke="#e8e8e8"/>
    <text x="48" y="185" class="word red">m</text>
    <text x="118" y="185" class="word orange">e</text>
    <text x="178" y="185" class="word blue">t</text>
    <text x="228" y="185" class="word green">r</text>
    <text x="276" y="185" class="word yellow">o</text>
    <text x="340" y="185" class="word ink">cl</text>
    <circle cx="454" cy="155" r="34" fill="none" stroke="#18191b" stroke-width="8"/>
    <line x1="454" y1="155" x2="454" y2="130" stroke="#18191b" stroke-width="7" stroke-linecap="round"/>
    <line x1="454" y1="155" x2="474" y2="168" stroke="#18191b" stroke-width="7" stroke-linecap="round"/>
    <text x="486" y="185" class="word ink">ck</text>
    <text x="24" y="258" class="note muted">Less referential: color is in the letters, and the clock glyph carries the product idea.</text>

    <g transform="translate(110 278)">
      <rect width="320" height="160" fill="#000" transform="scale(1 .32)"/>
      <text x="6" y="18" class="preview-text red">M</text>
      <text x="40" y="18" class="preview-text orange">E</text>
      <text x="74" y="18" class="preview-text blue">T</text>
      <text x="108" y="18" class="preview-text green">R</text>
      <text x="142" y="18" class="preview-text yellow">O</text>
      <text x="180" y="18" class="preview-text white">CL</text>
      <circle cx="247" cy="14" r="24" fill="none" stroke="#fff" stroke-width="4"/>
      <line x1="247" y1="14" x2="247" y2="1" stroke="#fff" stroke-width="3"/>
      <line x1="247" y1="14" x2="264" y2="26" stroke="#fff" stroke-width="3"/>
      <text x="275" y="18" class="preview-text white">CK</text>
    </g>
  </g>

  <!-- Option 3 -->
  <g transform="translate(1230 180)">
    <rect class="card" rx="18" width="500" height="330"/>
    <text x="24" y="42" class="card-title ink">3. Platform Pill</text>
    <line x1="24" y1="66" x2="476" y2="66" stroke="#e8e8e8"/>
    <rect x="38" y="106" width="424" height="108" rx="54" fill="#232527"/>
    <circle cx="76" cy="160" r="18" class="red"/>
    <circle cx="112" cy="160" r="18" class="orange"/>
    <circle cx="148" cy="160" r="18" class="blue"/>
    <circle cx="184" cy="160" r="18" class="green"/>
    <circle cx="220" cy="160" r="18" class="yellow"/>
    <text x="246" y="162" class="pill-word white">metro</text>
    <text x="250" y="196" class="word-small soft">clock</text>
    <text x="24" y="258" class="note muted">More transit-sign than wordmark. Original enough to own as a device identity.</text>

    <g transform="translate(88 278)">
      <rect width="320" height="160" fill="#000" transform="scale(1 .32)"/>
      <rect x="6" y="6" width="308" height="22" rx="9" fill="#161618" stroke="#555"/>
      <circle cx="32" cy="13" r="9" class="red"/>
      <circle cx="58" cy="13" r="9" class="orange"/>
      <circle cx="84" cy="13" r="9" class="blue"/>
      <circle cx="110" cy="13" r="9" class="green"/>
      <circle cx="136" cy="13" r="9" class="yellow"/>
      <text x="162" y="15" class="preview-text white">METRO</text>
      <text x="162" y="25" class="preview-text soft">CLOCK</text>
    </g>
  </g>

  <!-- Option 4 -->
  <g transform="translate(70 620)">
    <rect class="card" rx="18" width="540" height="330"/>
    <text x="24" y="42" class="card-title ink">4. Route Line</text>
    <line x1="24" y1="66" x2="516" y2="66" stroke="#e8e8e8"/>
    <line x1="92" y1="140" x2="436" y2="140" stroke="#282828" stroke-width="12" stroke-linecap="round"/>
    <circle cx="92" cy="140" r="31" class="red" stroke="#fff" stroke-width="6"/>
    <circle cx="178" cy="140" r="31" class="orange" stroke="#fff" stroke-width="6"/>
    <circle cx="264" cy="140" r="31" class="blue" stroke="#fff" stroke-width="6"/>
    <circle cx="350" cy="140" r="31" class="green" stroke="#fff" stroke-width="6"/>
    <circle cx="436" cy="140" r="31" class="yellow" stroke="#fff" stroke-width="6"/>
    <text x="118" y="218" class="word-small ink">metroclock</text>
    <text x="24" y="258" class="note muted">The circles become stops instead of letter backplates. Clean and less derivative.</text>

    <g transform="translate(110 278)">
      <rect width="320" height="160" fill="#000" transform="scale(1 .32)"/>
      <line x1="40" y1="12" x2="280" y2="12" stroke="#aaa" stroke-width="5"/>
      <circle cx="40" cy="12" r="14" class="red"/>
      <circle cx="100" cy="12" r="14" class="orange"/>
      <circle cx="160" cy="12" r="14" class="blue"/>
      <circle cx="220" cy="12" r="14" class="green"/>
      <circle cx="280" cy="12" r="14" class="yellow"/>
      <text x="50" y="30" class="preview-text white">METROCLOCK</text>
    </g>
  </g>

  <!-- Option 5 -->
  <g transform="translate(650 620)">
    <rect class="card" rx="18" width="540" height="330"/>
    <text x="24" y="42" class="card-title ink">5. Clock Stop</text>
    <line x1="24" y1="66" x2="516" y2="66" stroke="#e8e8e8"/>
    <text x="74" y="184" class="word ink">metr</text>
    <circle cx="302" cy="154" r="48" class="blue"/>
    <circle cx="302" cy="154" r="28" fill="none" stroke="#fff" stroke-width="8"/>
    <line x1="302" y1="154" x2="302" y2="132" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
    <line x1="302" y1="154" x2="322" y2="168" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
    <text x="356" y="184" class="word ink">clock</text>
    <circle cx="94" cy="226" r="10" class="red"/>
    <circle cx="128" cy="226" r="10" class="orange"/>
    <circle cx="162" cy="226" r="10" class="blue"/>
    <circle cx="196" cy="226" r="10" class="green"/>
    <circle cx="230" cy="226" r="10" class="yellow"/>
    <text x="24" y="258" class="note muted">Cleanest brand direction. One icon does the work, so the boot splash stays readable.</text>

    <g transform="translate(110 278)">
      <rect width="320" height="160" fill="#000" transform="scale(1 .32)"/>
      <text x="4" y="20" class="preview-text white">METR</text>
      <circle cx="176" cy="13" r="25" class="blue"/>
      <circle cx="176" cy="13" r="14" fill="none" stroke="#fff" stroke-width="3"/>
      <line x1="176" y1="13" x2="176" y2="4" stroke="#fff" stroke-width="3"/>
      <line x1="176" y1="13" x2="188" y2="21" stroke="#fff" stroke-width="3"/>
      <text x="220" y="20" class="preview-text white">CLK</text>
    </g>
  </g>

  <!-- Option 6 -->
  <g transform="translate(1230 620)">
    <rect class="card" rx="18" width="500" height="330"/>
    <text x="24" y="42" class="card-title ink">6. Boot Mark</text>
    <line x1="24" y1="66" x2="476" y2="66" stroke="#e8e8e8"/>
    <rect x="70" y="104" width="30" height="30" rx="8" class="red"/>
    <rect x="112" y="104" width="30" height="30" rx="8" class="orange"/>
    <rect x="154" y="104" width="30" height="30" rx="8" class="blue"/>
    <rect x="70" y="146" width="30" height="30" rx="8" class="green"/>
    <rect x="112" y="146" width="30" height="30" rx="8" fill="#232527"/>
    <rect x="154" y="146" width="30" height="30" rx="8" class="yellow"/>
    <rect x="70" y="188" width="30" height="30" rx="8" class="purple"/>
    <rect x="112" y="188" width="30" height="30" rx="8" class="teal"/>
    <rect x="154" y="188" width="30" height="30" rx="8" class="gray"/>
    <text x="226" y="156" class="word-small ink">metro</text>
    <text x="226" y="210" class="word-small muted">clock</text>
    <text x="24" y="258" class="note muted">Most practical for boot. Icon first, wordmark second, very readable on the matrix.</text>

    <g transform="translate(88 278)">
      <rect width="320" height="160" fill="#000" transform="scale(1 .32)"/>
      <rect x="10" y="6" width="18" height="7" class="red"/>
      <rect x="34" y="6" width="18" height="7" class="orange"/>
      <rect x="58" y="6" width="18" height="7" class="blue"/>
      <rect x="10" y="17" width="18" height="7" class="green"/>
      <rect x="34" y="17" width="18" height="7" fill="#232527"/>
      <rect x="58" y="17" width="18" height="7" class="yellow"/>
      <text x="106" y="15" class="preview-text white">METRO</text>
      <text x="106" y="27" class="preview-text soft">CLOCK</text>
    </g>
  </g>

  <g transform="translate(70 1080)">
    <rect width="1660" height="190" rx="18" fill="#1f2023"/>
    <text x="30" y="52" class="card-title white">Recommendation</text>
    <text x="30" y="92" class="subtitle" fill="#e7e7e7">For the LED boot screen, use option 5 or 6. They keep enough shape at 64x32 to read quickly.</text>
    <text x="30" y="130" class="subtitle" fill="#e7e7e7">For app/site branding, option 1 is closest to your circle-per-letter idea without becoming a direct copy.</text>
    <text x="30" y="168" class="subtitle" fill="#e7e7e7">I would avoid putting the full word inside overlapping circles on the matrix. It gets too dense at boot-screen size.</text>
  </g>
</svg>
